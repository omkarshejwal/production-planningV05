name: CI Pipeline

# This tells GitHub to run this workflow every time you push code
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          

      - name: Install dependencies
        run: |
          rm -f package-lock.json
          npm install --force


      - name: Run Linting
        run: npm run lint

      - name: Test Build
        run: npm run build

  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r Backend/requirements.txt
          pip install pytest

      - name: Run Tests
        run: pytest Backend/tests/
